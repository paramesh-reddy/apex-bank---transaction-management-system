version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://neondb_owner:npg_cB1oTNHC6Fga@ep-sweet-wildflower-b5tiqheb-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
